<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no
    "
  >


  <title>
    Scanner Kajian Akbar
  </title>


  <!-- QR SCANNER LIBRARY -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing:
        border-box;
    }


    body {

      margin:
        0;

      padding:
        0;

      background:
        #111;

      color:
        white;

      font-family:
        Arial,
        sans-serif;

      text-align:
        center;

    }


    .container {

      width:
        100%;

      max-width:
        600px;

      margin:
        auto;

      padding:
        15px;

    }


    h1 {

      margin:
        10px 0 5px;

      font-size:
        26px;

    }


    .subtitle {

      color:
        #aaa;

      margin-bottom:
        15px;

    }


    #setup {

      background:
        #222;

      padding:
        20px;

      border-radius:
        14px;

      margin-bottom:
        15px;

    }


    input {

      width:
        100%;

      max-width:
        350px;

      padding:
        15px;

      font-size:
        20px;

      text-align:
        center;

      border:
        none;

      border-radius:
        10px;

      margin-bottom:
        15px;

    }


    button {

      width:
        100%;

      max-width:
        350px;

      padding:
        16px;

      border:
        none;

      border-radius:
        10px;

      font-size:
        20px;

      font-weight:
        bold;

      cursor:
        pointer;

    }


    #startButton {

      background:
        #1565c0;

      color:
        white;

    }


    #reader {

      width:
        100%;

      margin:
        15px auto;

      background:
        black;

      border-radius:
        12px;

      overflow:
        hidden;

    }


    #status {

      width:
        100%;

      min-height:
        110px;

      margin:
        15px auto;

      padding:
        20px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      flex-direction:
        column;

      border-radius:
        14px;

      font-size:
        20px;

      font-weight:
        bold;

      background:
        #333;

    }


    .waiting {

      background:
        #333 !important;

    }


    .loading {

      background:
        #174a7e !important;

    }


    .success {

      background:
        #198754 !important;

    }


    .used {

      background:
        #a06a00 !important;

    }


    .invalid {

      background:
        #b02a37 !important;

    }


    .error {

      background:
        #842029 !important;

    }


    .big {

      font-size:
        28px;

      margin-bottom:
        8px;

    }


    .person-name {

      font-size:
        26px;

      margin-top:
        8px;

    }


    .ticket-code {

      margin-top:
        8px;

      font-size:
        18px;

      opacity:
        .9;

    }


    #requestFrame {

      position:
        absolute;

      width:
        1px;

      height:
        1px;

      border:
        0;

      opacity:
        0;

      pointer-events:
        none;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>

    📷 Scanner Kajian Akbar

  </h1>


  <div class="subtitle">

    Semusim Cinta Rumaisa Korsel

  </div>



  <!-- ===========================
       PANITIA SETUP
  ============================ -->

  <div id="setup">


    <input
      id="pin"
      type="password"
      inputmode="numeric"
      placeholder="PIN Panitia"
      autocomplete="off"
    >


    <br>


    <button
      id="startButton"
      onclick="startScanner()"
    >

      MULAI SCAN

    </button>


  </div>



  <!-- ===========================
       CAMERA
  ============================ -->

  <div id="reader"></div>



  <!-- ===========================
       RESULT
  ============================ -->

  <div
    id="status"
    class="waiting"
  >

    Masukkan PIN panitia
    kemudian tekan MULAI SCAN

  </div>



  <!--
    Apps Script response akan
    dimuat di sini.

    Tidak ada kamera di iframe.
  -->

  <iframe
    id="requestFrame"
    title="checkin"
  ></iframe>


</div>



<script>


/*************************************************
 * CONFIG
 *************************************************/


/*
 * GANTI URL INI dengan URL deployment
 * Apps Script /exec Anda.
 *
 * CONTOH:
 *
 * https://script.google.com/macros/s/
 * AKfycbxxxxxxxxxxxxxxxx/exec
 */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbz_OMrlvtVqLHcDGQ9cwLMQOpWNjLrOFFYcCiXRRK1xarWyLgxq8GgCV_HL1Wsed-Dn/exec";


const CHECKIN_TIMEOUT =
  15000;


const DUPLICATE_DELAY =
  6000;



/*************************************************
 * GLOBAL
 *************************************************/

let html5QrCode =
  null;


let scannerRunning =
  false;


let processing =
  false;


let currentRequestId =
  null;


let requestTimer =
  null;


let lastCode =
  "";


let lastCodeTime =
  0;


let audioContext =
  null;



/*************************************************
 * START SCANNER
 *************************************************/

async function startScanner() {


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if (!pin) {

    setStatus(

      "Masukkan PIN panitia terlebih dahulu.",

      "error"

    );

    return;

  }


  /*
   * Simpan hanya selama tab ini terbuka.
   */

  sessionStorage.setItem(
    "checkinPin",
    pin
  );


  /*
   * Audio context dibuat setelah
   * user menekan tombol supaya
   * beep bekerja di mobile.
   */

  try {

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;


    audioContext =
      new AudioCtx();


    await audioContext.resume();

  }

  catch (e) {}


  document
    .getElementById(
      "startButton"
    )
    .disabled =
      true;


  setStatus(

    "Meminta izin kamera...",

    "waiting"

  );


  try {


    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps:
        12,


      qrbox:
        function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.72;


          return {

            width:
              Math.floor(size),

            height:
              Math.floor(size)

          };

        }

    };


    await html5QrCode.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerRunning =
      true;


    document
      .getElementById(
        "setup"
      )
      .style
      .display =
        "none";


    setStatus(

      "Arahkan kamera ke QR tiket peserta",

      "waiting"

    );


  }

  catch (error) {


    console.error(
      error
    );


    setStatus(

      "❌ Kamera tidak dapat dibuka.<br><br>" +
      escapeHtml(
        error.message ||
        String(error)
      ),

      "error"

    );


    document
      .getElementById(
        "startButton"
      )
      .disabled =
        false;

  }

}



/*************************************************
 * QR SUCCESS
 *************************************************/

function onScanSuccess(
  decodedText
) {


  if (processing) {

    return;

  }


  const code =
    String(
      decodedText || ""
    ).trim();


  if (!code) {

    return;

  }


  const now =
    Date.now();


  /*
   * Hindari QR yang sama terbaca
   * berulang kali ketika HP masih
   * diarahkan ke tiket yang sama.
   */

  if (
    code === lastCode &&
    now - lastCodeTime <
      DUPLICATE_DELAY
  ) {

    return;

  }


  lastCode =
    code;


  lastCodeTime =
    now;


  processing =
    true;


  /*
   * Pause kamera sambil server
   * memeriksa tiket.
   */

  try {

    html5QrCode.pause(true);

  }

  catch (e) {}


  playBeep();


  setStatus(

    `
      <div class="big">
        ⏳ MEMERIKSA
      </div>

      <div class="ticket-code">
        ${escapeHtml(code)}
      </div>
    `,

    "loading"

  );


  sendCheckInRequest(
    code
  );

}



/*************************************************
 * NORMAL SCAN FAILURE
 *************************************************/

function onScanFailure(
  error
) {

  /*
   * Tidak perlu melakukan apa pun.
   *
   * Library mencoba membaca QR
   * berkali-kali per detik.
   */

}



/*************************************************
 * SEND CHECK-IN TO APPS SCRIPT
 *************************************************/

function sendCheckInRequest(
  code
) {


  const pin =
    sessionStorage
      .getItem(
        "checkinPin"
      ) || "";


  currentRequestId =
    createRequestId();


  const url =
    APPS_SCRIPT_URL +

    "?action=checkin" +

    "&code=" +
    encodeURIComponent(
      code
    ) +

    "&pin=" +
    encodeURIComponent(
      pin
    ) +

    "&rid=" +
    encodeURIComponent(
      currentRequestId
    );


  const iframe =
    document.getElementById(
      "requestFrame"
    );


  /*
   * Timeout bila koneksi internet
   * atau Apps Script bermasalah.
   */

  clearTimeout(
    requestTimer
  );


  requestTimer =
    setTimeout(
      function() {

        if (!processing) {

          return;

        }


        processing =
          false;


        currentRequestId =
          null;


        setStatus(

          `
            <div class="big">
              ❌ TIMEOUT
            </div>

            Tidak mendapat jawaban
            dari server.
          `,

          "error"

        );


        resumeScannerAfter(
          2500
        );

      },

      CHECKIN_TIMEOUT

    );


  /*
   * Ini membuat request langsung
   * ke Apps Script.
   */

  iframe.src =
    url;

}



/*************************************************
 * RECEIVE RESPONSE FROM APPS SCRIPT
 *************************************************/

window.addEventListener(

  "message",

  function(event) {


    const iframe =
      document.getElementById(
        "requestFrame"
      );


    /*
     * Hanya menerima message dari
     * iframe request kita sendiri.
     */

    if (
      event.source !==
      iframe.contentWindow
    ) {

      return;

    }


    const message =
      event.data;


    if (
      !message ||
      message.type !==
        "CHECKIN_RESULT"
    ) {

      return;

    }


    if (
      message.rid !==
      currentRequestId
    ) {

      return;

    }


    clearTimeout(
      requestTimer
    );


    currentRequestId =
      null;


    processing =
      false;


    /*
     * Kosongkan iframe setelah request.
     */

    iframe.src =
      "about:blank";


    showCheckInResult(
      message.data
    );

  }

);



/*************************************************
 * DISPLAY RESULT
 *************************************************/

function showCheckInResult(
  data
) {


  if (!data) {

    setStatus(

      "❌ Respons server tidak valid",

      "error"

    );


    resumeScannerAfter(
      2500
    );

    return;

  }



  /**************************************
   * SUCCESS
   **************************************/

  if (
    data.result ===
    "SUCCESS"
  ) {


    setStatus(

      `
        <div class="big">
          ✅ CHECK-IN BERHASIL
        </div>

        <div class="person-name">
          ${escapeHtml(data.name)}
        </div>

        <div class="ticket-code">
          ${escapeHtml(data.code)}
        </div>

        <div class="ticket-code">
          ${escapeHtml(data.time || "")}
        </div>
      `,

      "success"

    );


    vibrateSuccess();


    resumeScannerAfter(
      1800
    );


    return;

  }



  /**************************************
   * ALREADY CHECKED IN
   **************************************/

  if (
    data.result ===
    "ALREADY_CHECKED_IN"
  ) {


    setStatus(

      `
        <div class="big">
          ⚠️ SUDAH CHECK-IN
        </div>

        <div class="person-name">
          ${escapeHtml(data.name)}
        </div>

        <div class="ticket-code">
          ${escapeHtml(data.code)}
        </div>

        <div class="ticket-code">
          Check-in pertama:
          ${escapeHtml(data.time || "")}
        </div>
      `,

      "used"

    );


    vibrateWarning();


    resumeScannerAfter(
      2500
    );


    return;

  }



  /**************************************
   * INVALID
   **************************************/

  if (
    data.result ===
    "INVALID"
  ) {


    setStatus(

      `
        <div class="big">
          ❌ TIKET TIDAK VALID
        </div>

        <div class="ticket-code">
          ${escapeHtml(data.code || "")}
        </div>
      `,

      "invalid"

    );


    vibrateWarning();


    resumeScannerAfter(
      2500
    );


    return;

  }



  /**************************************
   * WRONG PIN
   **************************************/

  if (
    data.result ===
    "UNAUTHORIZED"
  ) {


    sessionStorage.removeItem(
      "checkinPin"
    );


    setStatus(

      `
        <div class="big">
          🔒 PIN SALAH
        </div>

        Silakan masukkan kembali
        PIN panitia.
      `,

      "error"

    );


    /*
     * Tampilkan input PIN lagi.
     */

    document
      .getElementById(
        "setup"
      )
      .style
      .display =
        "block";


    document
      .getElementById(
        "startButton"
      )
      .textContent =
        "LANJUTKAN";


    document
      .getElementById(
        "startButton"
      )
      .disabled =
        false;


    return;

  }



  /**************************************
   * SERVER ERROR
   **************************************/

  setStatus(

    `
      <div class="big">
        ❌ ERROR
      </div>

      ${escapeHtml(
        data.message ||
        "Terjadi kesalahan."
      )}
    `,

    "error"

  );


  resumeScannerAfter(
    2500
  );

}



/*************************************************
 * AUTO RESUME
 *************************************************/

function resumeScannerAfter(
  delay
) {


  setTimeout(

    function() {


      if (
        !html5QrCode ||
        !scannerRunning
      ) {

        return;

      }


      try {

        html5QrCode.resume();

      }

      catch (e) {

        console.error(e);

      }


      setStatus(

        "Arahkan kamera ke QR tiket berikutnya",

        "waiting"

      );


    },

    delay

  );

}



/*************************************************
 * BEEP
 *************************************************/

function playBeep() {


  try {


    if (!audioContext) {

      return;

    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      900;


    gain.gain.value =
      0.12;


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    setTimeout(

      function() {

        oscillator.stop();

      },

      100

    );


  }

  catch (e) {}

}



/*************************************************
 * VIBRATION
 *************************************************/

function vibrateSuccess() {

  try {

    navigator.vibrate(
      80
    );

  }

  catch (e) {}

}


function vibrateWarning() {

  try {

    navigator.vibrate(
      [100, 70, 100]
    );

  }

  catch (e) {}

}



/*************************************************
 * STATUS
 *************************************************/

function setStatus(
  message,
  type
) {


  const element =
    document.getElementById(
      "status"
    );


  element.className =
    type;


  element.innerHTML =
    message;

}



/*************************************************
 * REQUEST ID
 *************************************************/

function createRequestId() {


  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (

    Date.now()
      .toString(36) +

    "-" +

    Math.random()
      .toString(36)
      .substring(2)

  );

}



/*************************************************
 * ESCAPE HTML
 *************************************************/

function escapeHtml(
  text
) {


  return String(
    text || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


</script>


</body>

</html>
