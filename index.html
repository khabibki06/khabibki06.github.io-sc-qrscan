<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Semusim cinta Rumaisya Korsel 2026</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 550px;
      margin: 15px auto;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    #status {
      max-width: 550px;
      min-height: 130px;
      margin: 20px auto;
      padding: 25px 15px;
      border-radius: 15px;
      background: #333;
      font-size: 20px;
      font-weight: bold;
    }

    .success {
      background: #198754 !important;
    }

    .used {
      background: #a06a00 !important;
    }

    .invalid {
      background: #b02a37 !important;
    }

    .loading {
      background: #174a7e !important;
    }

    .error {
      background: #842029 !important;
    }

    .big {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .name {
      font-size: 26px;
      margin: 12px 0;
    }

    .code {
      font-size: 18px;
      margin-top: 8px;
    }

    button {
      padding: 18px 30px;
      font-size: 22px;
      font-weight: bold;
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>📷 QRCode Scanner Semusim cinta Rumaisya Korsel 2026</h1>

  <div class="subtitle">
    Semusim Cinta Rumaisa Korsel
  </div>

  <button
    id="startButton"
    onclick="startScanner()"
  >
    MULAI SCAN
  </button>

  <div id="reader"></div>

  <div id="status">
    Tekan MULAI SCAN
  </div>

<script>

/*********************************************
 * CONFIGURATION
 *********************************************/

// GANTI dengan URL Cloudflare Worker Anda
const WORKER_URL =
  'https://sc-rumaisya-2026.khabibki06.workers.dev';

const DUPLICATE_DELAY = 8000;


/*********************************************
 * GLOBAL VARIABLES
 *********************************************/

let html5QrCode = null;

let processing = false;

let scannerRunning = false;

let lastCode = '';

let lastScanTime = 0;

let audioContext = null;


/*********************************************
 * START CAMERA
 *********************************************/

async function startScanner() {

  const startButton =
    document.getElementById('startButton');

  startButton.disabled = true;

  setStatus(
    'Meminta izin kamera...',
    'loading'
  );

  try {

    // Inisialisasi audio untuk bunyi beep
    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if (AudioCtx) {
      audioContext = new AudioCtx();
      await audioContext.resume();
    }

    html5QrCode = new Html5Qrcode('reader');

    await html5QrCode.start(

      {
        facingMode: 'environment'
      },

      {
        fps: 12,

        qrbox: function(width, height) {

          const size = Math.floor(
            Math.min(width, height) * 0.72
          );

          return {
            width: size,
            height: size
          };
        }
      },

      onScanSuccess,

      function() {}

    );

    scannerRunning = true;

    startButton.style.display = 'none';

    setStatus(
      'Arahkan kamera ke QR tiket peserta',
      ''
    );

  } catch (error) {

    startButton.disabled = false;

    setStatus(
      '❌ Kamera gagal dibuka: ' +
      escapeHtml(error.message || error),
      'error'
    );

  }
}


/*********************************************
 * QR DETECTED
 *********************************************/

function onScanSuccess(decodedText) {

  if (processing) return;

  const code =
    String(decodedText || '').trim();

  if (!code) return;

  const now = Date.now();

  // Cegah scan berulang dalam 8 detik
  if (
    code === lastCode &&
    now - lastScanTime < DUPLICATE_DELAY
  ) {
    return;
  }

  lastCode = code;
  lastScanTime = now;

  processing = true;

  // Pause camera
  try {
    html5QrCode.pause(true);
  } catch (e) {}

  playBeep();

  setStatus(
    `
      <div class="big">⏳ MEMERIKSA</div>
      <div class="code">${escapeHtml(code)}</div>
    `,
    'loading'
  );

  sendCheckInRequest(code);
}


/*********************************************
 * SEND REQUEST TO CLOUDFLARE
 *********************************************/

async function sendCheckInRequest(code) {

  const controller = new AbortController();

  const timeout = setTimeout(function() {
    controller.abort();
  }, 25000);

  try {

    const response = await fetch(
      WORKER_URL,
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          code: code
        }),

        signal: controller.signal,

        cache: 'no-store'
      }
    );

    const data = await response.json();

    if (
      !response.ok &&
      data.result !== 'UNAUTHORIZED'
    ) {
      throw new Error(
        data.message ||
        'HTTP ' + response.status
      );
    }

    showCheckInResult(data);

  } catch (error) {

    setStatus(
      '❌ KONEKSI GAGAL: ' +
      escapeHtml(error.message),
      'error'
    );

    resumeScannerAfter(3000);

  } finally {

    clearTimeout(timeout);

    processing = false;
  }
}


/*********************************************
 * DISPLAY RESULT
 *********************************************/

function showCheckInResult(data) {

  // SUCCESS
  if (data.result === 'SUCCESS') {

    setStatus(
      `
        <div class="big">
          ✅ CHECK-IN BERHASIL
        </div>

        <div class="name">
          ${escapeHtml(data.name)}
        </div>

        <div class="code">
          ${escapeHtml(data.code)}
        </div>

        <div class="code">
          ${escapeHtml(data.time || '')}
        </div>
      `,
      'success'
    );

    vibrate([80]);

    resumeScannerAfter(1800);
    return;
  }

  // ALREADY CHECKED IN
  if (
    data.result === 'ALREADY_CHECKED_IN'
  ) {

    setStatus(
      `
        <div class="big">
          ⚠️ SUDAH CHECK-IN
        </div>

        <div class="name">
          ${escapeHtml(data.name)}
        </div>

        <div class="code">
          ${escapeHtml(data.code)}
        </div>

        <div class="code">
          Check-in pertama:
          ${escapeHtml(data.time || '')}
        </div>
      `,
      'used'
    );

    vibrate([100, 70, 100]);

    resumeScannerAfter(2500);
    return;
  }

  // INVALID TICKET
  if (data.result === 'INVALID') {

    setStatus(
      `
        <div class="big">
          ❌ TIKET TIDAK VALID
        </div>

        <div class="code">
          ${escapeHtml(data.code || '')}
        </div>
      `,
      'invalid'
    );

    vibrate([100, 70, 100]);

    resumeScannerAfter(2500);
    return;
  }

  // OTHER ERRORS
  setStatus(
    `
      <div class="big">❌ ERROR</div>
      ${escapeHtml(data.message || 'Server error')}
    `,
    'error'
  );

  resumeScannerAfter(3000);
}


/*********************************************
 * AUTO RESUME
 *********************************************/

function resumeScannerAfter(delay) {

  setTimeout(function() {

    if (!html5QrCode || !scannerRunning) {
      return;
    }

    try {

      html5QrCode.resume();

      setStatus(
        'Arahkan kamera ke QR tiket berikutnya',
        ''
      );

    } catch (error) {

      console.error(error);

    }

  }, delay);
}


/*********************************************
 * AUDIO BEEP
 *********************************************/

function playBeep() {

  try {

    if (!audioContext) return;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = 'sine';
    oscillator.frequency.value = 900;

    gain.gain.value = 0.12;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    setTimeout(function() {
      oscillator.stop();
    }, 120);

  } catch (e) {}
}


/*********************************************
 * VIBRATION
 *********************************************/

function vibrate(pattern) {

  try {
    navigator.vibrate(pattern);
  } catch (e) {}
}


/*********************************************
 * STATUS
 *********************************************/

function setStatus(message, type) {

  const element =
    document.getElementById('status');

  element.className = type;

  element.innerHTML = message;
}


/*********************************************
 * HTML ESCAPE
 *********************************************/

function escapeHtml(text) {

  return String(text ?? '')

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

</script>

</body>
</html>
